<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Hack Days story 2: team diff</title><link rel="stylesheet" href="../../tools/fonts.css">
<style>
.frame{height:1920px}
.top{position:absolute;left:72px;right:72px;top:262px;display:flex;justify-content:space-between;align-items:center;color:var(--muted)}
.top .dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--orange);margin-right:14px;box-shadow:0 0 14px rgba(243,112,33,.9);vertical-align:middle;position:relative;top:-2px}
.head{position:absolute;left:72px;right:72px;top:340px;font-family:"Serif";font-size:150px;line-height:.96;letter-spacing:-.02em}
.head .sub{display:block;font-family:Sans;font-size:36px;line-height:1.35;color:#C9C9CF;letter-spacing:0;margin-top:30px}
.head em{color:var(--orange);font-style:italic}
.glow{position:absolute;left:-200px;top:900px;width:1400px;height:900px;background:radial-gradient(closest-side,rgba(30,155,234,.12),rgba(30,155,234,0))}
.diff{position:absolute;left:72px;right:72px;top:900px;background:var(--char);border:2px solid var(--line);border-radius:26px;overflow:hidden;font-family:Mono;font-size:34px;line-height:1.5}
.diff .bar{padding:18px 32px;font-size:24px;color:var(--muted);border-bottom:2px solid var(--line);letter-spacing:.06em}
.diff .l{padding:10px 32px;white-space:nowrap}
.diff .rm{background:rgba(255,255,255,.04);color:#8A8A93;text-decoration:line-through;text-decoration-color:rgba(138,138,147,.6)}
.diff .add{background:rgba(243,112,33,.14);color:#fff}
.diff .add b{color:var(--orange);font-weight:500}
.diff .gap{height:14px}
.cta{position:absolute;left:72px;right:72px;top:1530px;display:flex;justify-content:space-between;align-items:flex-end}
.cta .label{color:var(--muted);font-size:19px;display:block;margin-bottom:12px}
.cta .u2{font-family:Mono;font-size:30px;color:#fff}
.cta .r2{font-family:"Serif";font-style:italic;font-size:48px;color:var(--orange)}
</style></head>
<body><div class="frame">
<div class="glow"></div>
<div class="top label"><div><span class="dot"></span>Myth vs fact</div><div>Hack Days &middot; Ed. 01</div></div>
<div class="head">Do you need <em>a team?</em><span class="sub">Read the diff. Hack Days is online and open to all of India.</span></div>
<div class="diff"><div class="bar">registration.diff</div>
<div class="l rm">- team: "required"</div>
<div class="l rm">- size: "5+ people"</div>
<div class="gap"></div>
<div class="l add">+ team: <b>"optional"</b></div>
<div class="l add">+ size: <b>"solo, or 2&ndash;4"</b></div>
<div class="gap"></div></div>
<div class="cta"><div><span class="label">Registration closes 15 Nov, 11:59 PM IST</span><div class="u2">hackathon.homingo.co.in</div></div><div class="r2">Link in bio</div></div>
<div class="grain"></div>
</div></body></html>
