<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Hack Days story 2: perks that stay</title><link rel="stylesheet" href="../../tools/fonts.css">
<style>
.frame{height:1920px}
.top{position:absolute;left:72px;right:72px;top:262px;display:flex;justify-content:space-between;align-items:center;color:var(--muted)}
.top .dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--blue);margin-right:14px;box-shadow:0 0 14px rgba(30,155,234,.9);vertical-align:middle;position:relative;top:-2px}
.head{position:absolute;left:72px;right:72px;top:340px;font-family:"Serif";font-size:146px;line-height:.98;letter-spacing:-.02em}
.head .sub{display:block;font-family:Sans;font-size:35px;line-height:1.35;color:#C9C9CF;letter-spacing:0;margin-top:28px}
.head em{color:var(--orange);font-style:italic}
.glow{position:absolute;left:-200px;top:900px;width:1400px;height:800px;background:radial-gradient(closest-side,rgba(30,155,234,.14),rgba(30,155,234,0))}
.todo{position:absolute;left:72px;right:72px;top:880px;background:var(--char);border:2px solid var(--line);border-radius:26px;padding:30px 40px 24px;font-family:Mono;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.todo .cmd{font-size:24px;letter-spacing:.04em;color:var(--muted);margin-bottom:14px}
.todo .cmd b{color:var(--blue);font-weight:500}
.i{display:flex;align-items:center;gap:26px;padding:26px 0;border-top:1px solid var(--line);font-size:38px;color:#fff;font-weight:500}
.box{flex:none;width:46px;height:46px;border:3px solid var(--orange);border-radius:10px;position:relative}
.box:after{content:"";position:absolute;left:12px;top:3px;width:14px;height:26px;border:solid var(--orange);border-width:0 5px 5px 0;transform:rotate(40deg)}
.i.open .box{border-color:var(--blue)}.i.open .box:after{display:none}
.cur{display:inline-block;width:18px;height:36px;background:var(--blue);vertical-align:middle;margin-left:10px}
.cta{position:absolute;left:72px;right:72px;top:1500px;display:flex;justify-content:space-between;align-items:flex-end}
.cta .label{color:var(--muted);font-size:19px;display:block;margin-bottom:12px}
.cta .u2{font-family:Mono;font-size:30px;color:#fff}
.cta .r2{white-space:nowrap;font-family:"Serif";font-style:italic;font-size:48px;color:var(--orange)}
</style></head>
<body><div class="frame">
<div class="glow"></div>
<div class="top label"><div><span class="dot"></span>Perks</div><div>Hack Days &middot; Ed. 01</div></div>
<div class="head">The hackathon ends. <em>These four stay.</em><span class="sub">Perks for builders in Hack Days Edition 01.</span></div>
<div class="todo"><div class="cmd"><b>$</b> cat after-hack-days.md</div>
<div class="i"><div class="box"></div>Portfolio reviews</div>
<div class="i"><div class="box"></div>LinkedIn recommendations</div>
<div class="i"><div class="box"></div>Alumni community</div>
<div class="i open"><div class="box"></div>Early access to future editions<span class="cur"></span></div>
</div>
<div class="cta"><div><span class="label">Registration closes 15 Nov, 11:59 PM IST</span><div class="u2">hackathon.homingo.co.in</div></div><div class="r2">Link in bio</div></div>
<div class="grain"></div>
</div></body></html>
