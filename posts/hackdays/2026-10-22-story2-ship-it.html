<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Hack Days story 2: sleep on it or ship it</title><link rel="stylesheet" href="../../tools/fonts.css">
<style>
.frame{height:1920px;overflow:hidden}
.top{position:absolute;left:72px;right:72px;top:262px;display:flex;justify-content:space-between;align-items:center;color:var(--muted)}
.top .dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--orange);margin-right:14px;box-shadow:0 0 14px rgba(243,112,33,.9);vertical-align:middle;position:relative;top:-2px}
.head{position:absolute;left:72px;right:72px;top:340px;font-family:"Serif";font-size:160px;line-height:.95;letter-spacing:-.02em}
.head .sub{display:block;font-family:Sans;font-size:36px;line-height:1.35;color:#C9C9CF;letter-spacing:0;margin-top:30px}
.head em{color:var(--orange);font-style:italic}
.sun{position:absolute;left:50%;margin-left:-330px;top:1040px;width:660px;height:330px;border-radius:330px 330px 0 0;background:radial-gradient(circle at 50% 100%,#FF9A52 0%,#F37021 45%,rgba(243,112,33,.55) 100%);box-shadow:0 0 140px rgba(243,112,33,.55)}
.line{position:absolute;left:0;right:0;top:1370px;height:4px;background:linear-gradient(90deg,rgba(30,155,234,0),#1E9BEA 30%,#1E9BEA 70%,rgba(30,155,234,0));box-shadow:0 0 30px rgba(30,155,234,.9)}
.cur{position:absolute;left:50%;margin-left:-8px;top:1342px;width:16px;height:60px;background:#1E9BEA;box-shadow:0 0 26px rgba(30,155,234,1)}
.pick{position:absolute;left:72px;right:72px;top:830px;display:flex;gap:24px}
.c{flex:1;background:var(--char);border:1px solid var(--line);border-radius:28px;padding:34px 36px;font-family:Sans;font-size:44px;color:#9a9aa3}
.c small{display:block;font-family:Mono;font-size:22px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.c.on{border-color:var(--orange);background:rgba(243,112,33,.14);box-shadow:0 0 34px rgba(243,112,33,.4);color:#fff;font-family:"Serif";font-style:italic;font-size:62px;line-height:1}
.c.on small{color:var(--orange);font-style:normal}
.cta{position:absolute;left:72px;right:72px;top:1500px;display:flex;justify-content:space-between;align-items:flex-end}
.cta .label{color:var(--muted);font-size:19px;display:block;margin-bottom:12px}
.cta .u2{font-family:Mono;font-size:30px;color:#fff}
.cta .r2{font-family:"Serif";font-style:italic;font-size:48px;color:var(--orange)}
</style></head>
<body><div class="frame">
<div class="top label"><div><span class="dot"></span>This or that</div><div>Hack Days · Ed. 01</div></div>
<div class="head">Sleep on it, or <em>ship it?</em><span class="sub">Code till dawn. Ship by sunrise. Online, open to all of India, solo or teams of 2–4.</span></div>
<div class="pick"><div class="c"><small>Option A</small>Sleep on it</div><div class="c on"><small>Option B</small>Ship it</div></div>
<div class="sun"></div><div class="line"></div><div class="cur"></div>
<div class="cta"><div><span class="label">Registration closes 15 Nov, 11:59 PM IST</span><div class="u2">hackathon.homingo.co.in</div></div><div class="r2">Link in bio</div></div>
<div class="grain"></div>
</div></body></html>
