<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Hack Days story: 21 days</title><link rel="stylesheet" href="../../tools/fonts.css">
<style>
.frame{height:1920px}
.top{position:absolute;left:72px;right:72px;top:262px;display:flex;justify-content:space-between;align-items:center;color:var(--muted)}
.top .dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--orange);margin-right:14px;box-shadow:0 0 14px rgba(243,112,33,.9);vertical-align:middle;position:relative;top:-2px}
.head{position:absolute;left:72px;right:72px;top:340px;font-family:"Serif";font-size:150px;line-height:.98;letter-spacing:-.02em}
.head .sub{display:block;font-family:Sans;font-size:35px;line-height:1.35;color:#C9C9CF;letter-spacing:0;margin-top:30px}
.head em{color:var(--orange);font-style:italic}
.glow{position:absolute;left:-200px;top:850px;width:1400px;height:900px;background:radial-gradient(closest-side,rgba(243,112,33,.13),rgba(243,112,33,0))}
.grid{position:absolute;left:72px;right:72px;top:960px;display:grid;grid-template-columns:repeat(7,1fr);gap:26px 0}
.grid i{display:block;width:110px;height:110px;border-radius:50%;border:3px solid var(--line);background:var(--char)}
.grid i.on{background:var(--orange);border-color:var(--orange);box-shadow:0 0 60px rgba(243,112,33,.7)}
.cap{position:absolute;left:72px;right:72px;top:1370px;display:flex;justify-content:space-between;font-family:Mono;font-size:26px;color:var(--muted);letter-spacing:.06em}
.cap b{color:var(--orange);font-weight:500}
.cta{position:absolute;left:72px;right:72px;top:1500px;display:flex;justify-content:space-between;align-items:flex-end}
.cta .label{color:var(--muted);font-size:19px;display:block;margin-bottom:12px}
.cta .u2{font-family:Mono;font-size:30px;color:#fff}
.cta .r2{white-space:nowrap;font-family:"Serif";font-style:italic;font-size:48px;color:var(--orange)}
</style></head>
<body><div class="frame">
<div class="glow"></div>

<div class="cta"><div><span class="label">Code till dawn. Ship by sunrise.</span><div class="u2">hackathon.homingo.co.in</div></div><div class="r2">Link in bio</div></div>
<div class="grain"></div>
</div></body></html>
