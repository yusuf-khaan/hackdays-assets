<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../tools/fonts.css">
<style>
.sunglow{position:absolute;right:-260px;top:520px;width:1100px;height:760px;background:radial-gradient(closest-side,rgba(243,112,33,.30),rgba(243,112,33,0))}
.sun{position:absolute;right:-170px;top:680px;width:700px;height:350px;border-radius:350px 350px 0 0;background:linear-gradient(#F37021,#E2601A)}
.horizon{position:absolute;right:-170px;top:1030px;width:700px;height:14px;border-radius:7px;background:var(--blue);box-shadow:0 0 34px rgba(30,155,234,.85)}
.bot{position:absolute;right:-30px;top:170px;width:620px;height:870px;background:url(../../brand/bot-hero.png) center/cover;
 -webkit-mask-image:radial-gradient(62% 58% at 52% 46%,#000 70%,transparent 100%);mask-image:radial-gradient(62% 58% at 52% 46%,#000 70%,transparent 100%)}
.bubble{position:absolute;right:530px;top:395px;background:var(--char);border:1px solid var(--line);border-radius:18px 18px 4px 18px;padding:16px 22px;font-family:Mono;font-size:21px;color:#D4D4D8;box-shadow:0 20px 40px rgba(0,0,0,.5)}
.bubble b{color:var(--orange);font-weight:500}
.top{position:absolute;left:72px;right:72px;top:64px;display:flex;justify-content:space-between;color:var(--muted)}
.top i{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--orange);margin-right:14px;box-shadow:0 0 14px rgba(243,112,33,.9);vertical-align:2px}
h1{position:absolute;left:72px;top:150px;font-family:Serif;font-weight:400;font-size:112px;line-height:.9;letter-spacing:-.02em;width:520px}
h1 em{color:var(--orange)}
.kick{position:absolute;left:72px;top:610px;color:var(--orange)}
.date{position:absolute;left:62px;top:640px;font-family:Serif;font-size:330px;line-height:1;letter-spacing:-.04em;color:#fff;text-shadow:0 10px 60px rgba(0,0,0,.7)}
.date span{font-style:italic;color:var(--orange)}
.year{position:absolute;left:78px;top:960px;font-family:Mono;font-size:24px;color:var(--muted)}
.year b{color:#fff;font-weight:500}
.tl{position:absolute;left:72px;right:72px;top:1060px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tl div{background:rgba(20,20,22,.88);border:1px solid var(--line);border-radius:18px;padding:20px 22px}
.tl small{display:block;font-family:Sans;font-weight:600;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.tl p{font-size:24px;line-height:1.3;color:#fff}
.tl .hot{border-color:rgba(243,112,33,.55)}
.tl .hot small{color:var(--orange)}
.foot{position:absolute;left:72px;right:72px;bottom:58px;display:flex;justify-content:space-between;align-items:center}
.chips{display:flex;gap:10px}
.chips span{font-family:Mono;font-size:19px;color:#D4D4D8;border:1px solid var(--line);border-radius:999px;padding:9px 16px}
.url{font-family:Mono;font-size:22px;color:#fff}
</style></head>
<body><div class="frame">
<div class="sunglow"></div><div class="sun"></div><div class="horizon"></div>
<div class="bot"></div>
<div class="bubble">&gt; countdown: <b>39 days left</b></div>

<div class="top label"><div><i></i>Homingo Hack Days</div><div>AI Engineering · Online</div></div>

<h1>Wake up, <em>builder.</em></h1>

<div class="kick label">Registrations close</div>
<div class="date">15<span>.</span>11</div>
<div class="year"><b>Sun, 15 Nov</b> · <b>11:59 PM IST</b></div>

<div class="tl">
<div class="hot"><small>Countdown</small><p><b style="font-family:Serif;font-weight:400;font-size:40px;color:var(--orange)">39</b> days left</p></div>
<div><small>Kick-off</small><p>21 Nov</p></div>
<div><small>Demo day</small><p>19 Dec</p></div>
</div>

<div class="foot">
<div class="chips"><span>agents</span><span>automation</span><span>llm_apps</span></div>
<div class="url">hackathon.homingo.co.in</div>
</div>
<div class="grain"></div>
</div></body></html>
