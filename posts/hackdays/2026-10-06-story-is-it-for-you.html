<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../tools/fonts.css">
<style>
.frame{width:1080px;height:1920px}
.glow{position:absolute;left:50%;bottom:-420px;width:1300px;height:900px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(243,112,33,.30),rgba(243,112,33,0))}
.sun{position:absolute;left:50%;bottom:-220px;width:760px;height:380px;transform:translateX(-50%);border-radius:380px 380px 0 0;background:var(--orange)}
.horizon{position:absolute;left:50%;bottom:-248px;width:760px;height:16px;transform:translateX(-50%);border-radius:8px;background:var(--blue);box-shadow:0 0 34px rgba(30,155,234,.8)}
.eyebrow{position:absolute;left:84px;top:290px;color:var(--muted)}
.eyebrow i{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--orange);margin-right:14px;box-shadow:0 0 14px rgba(243,112,33,.9);vertical-align:2px}
h1{position:absolute;left:84px;right:84px;top:360px;font-family:Serif;font-weight:400;font-size:150px;line-height:.88;letter-spacing:-.02em}
h1 em{color:var(--orange)}
.file{position:absolute;left:84px;right:84px;top:720px;background:var(--char);border:1px solid var(--line);border-radius:26px;overflow:hidden}
.file .hd{padding:24px 32px;border-bottom:1px solid var(--line);font-family:Mono;font-size:22px;color:#5E5E66}
.list{padding:18px 32px 26px;font-family:Mono;font-size:30px;color:#D4D4D8}
.list div{padding:20px 0;border-bottom:1px dashed #26262B;display:flex;gap:22px;align-items:center}
.list div:last-child{border-bottom:0}
.list b{color:var(--blue);font-weight:500}
.ans{position:absolute;left:84px;right:84px;top:1360px;font-family:Serif;font-size:96px;line-height:1}
.ans em{color:var(--orange)}
.cta{position:absolute;left:84px;top:1490px;display:flex;align-items:center;gap:18px;font-family:Mono;font-size:28px;color:#fff}
.cta span{color:var(--muted);font-family:Sans;font-weight:600;font-size:20px;letter-spacing:.22em;text-transform:uppercase}
</style></head>
<body><div class="frame">
<div class="glow"></div><div class="sun"></div><div class="horizon"></div>
<div class="eyebrow label"><i></i>Hack Days · Edition 01</div>
<h1>Is it <em>for you?</em></h1>
<div class="file">
<div class="hd">todo.md</div>
<div class="list">
<div><b>[x]</b>student or early-career dev</div>
<div><b>[x]</b>anywhere in India</div>
<div><b>[x]</b>solo or a team of 2–4</div>
<div><b>[x]</b>curious about agents &amp; LLMs</div>
<div><b>[x]</b>can build online from home</div>
</div>
</div>
<div class="ans">Then <em>yes.</em></div>
<div class="cta">hackathon.homingo.co.in<span>· Link in bio</span></div>
<div class="grain"></div>
</div></body></html>
