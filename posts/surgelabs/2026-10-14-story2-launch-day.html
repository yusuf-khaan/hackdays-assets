<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>SurgeLabs story: launch day</title>
<link rel="stylesheet" href="../../tools/fonts.css">
<style>
:root{--bg:#0A0A0C;--fg:#F2F2F0;--teal:#2DD4BF;--purple:#A78BFA;--muted:#9A9AA3;--soft:#C8C8CE;--line:#2A2A31;--grid:#16161B}
html,body{margin:0;background:var(--bg)}
.frame{width:1080px;height:1920px;position:relative;overflow:hidden;color:var(--fg);font-family:Sans;background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:90px 90px}
.glow{position:absolute;width:1100px;height:1000px;pointer-events:none}
.top{position:absolute;left:72px;right:72px;top:270px;display:flex;justify-content:space-between;align-items:center;font-family:Mono;font-size:22px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mark{font-family:Sans;font-weight:600;font-size:34px;letter-spacing:-.03em;text-transform:none;color:var(--fg)}
.mark span{color:var(--teal)}
h1{position:absolute;left:72px;right:72px;top:360px;font-size:100px;font-weight:600;letter-spacing:-.045em;line-height:1.03;margin:0}
.t{color:var(--teal)}
.sub{display:block;font-size:34px;line-height:1.35;color:var(--soft);font-weight:400;letter-spacing:0;margin-top:30px}
.card{position:absolute;left:72px;right:72px;top:1000px;height:470px;background:#111114;border:1px solid var(--line);border-radius:26px}
.card .k{position:absolute;left:36px;top:26px;font:500 22px Mono;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card .il{position:absolute;right:36px;top:26px;font:500 20px Mono;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card svg{position:absolute;left:0;top:60px;width:936px;height:400px}
.chip{position:absolute;left:72px;top:1520px;font-family:Mono;font-size:26px;color:var(--teal);border:2px solid var(--teal);border-radius:999px;padding:14px 28px}
</style></head>
<body><div class="frame">
<div class="glow" style="left:-300px;top:-200px;background:radial-gradient(closest-side,rgba(139,108,255,.22),transparent)"></div>
<div class="glow" style="right:-400px;bottom:-200px;background:radial-gradient(closest-side,rgba(45,212,191,.14),transparent)"></div>
<div class="top"><div class="mark"><span>&#9632;</span> SURGELABS</div><div>Scalable infrastructure</div></div>
<h1>It works for you. <span class="t">What about everyone at once?</span><span class="sub">Scalable infrastructure is what keeps launch day from being the day it falls over.</span></h1>
<div class="card"><div class="k">Same app, two backends</div><div class="il">Illustration</div>
<svg viewBox="0 0 936 400">
 <g stroke="#2A2A31" stroke-width="2"><path d="M60 330 H890"/><path d="M60 330 V20"/></g>
 <path d="M60 300 L890 80" fill="none" stroke="#9A9AA3" stroke-width="5" stroke-dasharray="3 14" stroke-linecap="round"/>
 <path d="M60 220 H890" fill="none" stroke="#A78BFA" stroke-width="6" stroke-linecap="round"/>
 <circle cx="362" cy="220" r="12" fill="#A78BFA"/>
 <text x="392" y="262" fill="#A78BFA" font-family="Mono" font-size="26">falls over here</text>
 <path d="M60 250 H200 V200 H340 V150 H480 V110 H620 V70 H760 V40 H890" fill="none" stroke="#2DD4BF" stroke-width="6" stroke-linejoin="round"/>
 <g font-family="Mono" font-size="22">
  <text x="60" y="372" fill="#9A9AA3">- - visitors</text>
  <text x="290" y="372" fill="#A78BFA">&#8212; fixed server</text>
  <text x="560" y="372" fill="#2DD4BF">&#8212; grows with the crowd</text>
 </g>
</svg></div>
<div class="chip">surgeit.co.in</div>
</div></body></html>
