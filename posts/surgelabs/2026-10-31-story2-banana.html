<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>SurgeLabs story 2: banana quiz</title>
<link rel="stylesheet" href="../../tools/fonts.css">
<style>
:root{--bg:#0A0A0C;--fg:#F2F2F0;--teal:#2DD4BF;--purple:#A78BFA;--muted:#9A9AA3;--soft:#C8C8CE;--line:#2A2A31;--grid:#16161B}
html,body{margin:0;background:var(--bg)}
.frame{width:1080px;height:1920px;position:relative;overflow:hidden;color:var(--fg);font-family:Sans;background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:90px 90px}
.glow{position:absolute;width:1100px;height:1000px;pointer-events:none}
.top{position:absolute;left:72px;right:72px;top:270px;display:flex;justify-content:space-between;align-items:center;font-family:Mono;font-size:22px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mark{font-family:Sans;font-weight:600;font-size:34px;letter-spacing:-.045em;text-transform:none;color:var(--fg)}
.mark span{color:var(--teal)}
h1{position:absolute;left:72px;right:72px;top:350px;font-size:128px;font-weight:600;letter-spacing:-.045em;line-height:1.0;margin:0}
.t{color:var(--teal)}
.sub{display:block;font-size:36px;line-height:1.35;color:var(--soft);font-weight:400;letter-spacing:0;margin-top:26px}
.code{position:absolute;left:72px;right:72px;top:960px;background:#111114;border:1px solid var(--line);border-radius:24px;padding:26px 0 34px;font-family:Mono;overflow:hidden;font-variant-ligatures:none}
.hd{padding:0 34px 18px;color:var(--muted);font-size:21px;letter-spacing:.08em;border-bottom:1px solid var(--line)}
.ln{padding:28px 34px 8px;font-size:34px;color:var(--soft);white-space:nowrap}
.k{color:var(--purple)}.s{color:var(--teal)}
.out{margin:16px 34px 0;padding:18px 22px;border:1px dashed var(--teal);border-radius:14px;font-size:30px;color:var(--teal);background:rgba(45,212,191,.07)}
.out i{font-style:normal;color:var(--muted)}
.reply{position:absolute;left:72px;right:72px;top:1420px;font-family:Mono;font-size:26px;letter-spacing:.06em;color:var(--soft)}
.reply b{color:var(--teal);font-weight:500}
.foot{position:absolute;left:72px;right:72px;top:1520px;font-family:Mono;font-size:23px;line-height:1.7;color:var(--muted)}
.foot b{color:var(--fg);font-weight:500}
</style></head>
<body><div class="frame">
<div class="glow" style="left:-300px;top:-200px;background:radial-gradient(closest-side,rgba(139,108,255,.22),transparent)"></div>
<div class="glow" style="right:-400px;bottom:-200px;background:radial-gradient(closest-side,rgba(45,212,191,.14),transparent)"></div>
<div class="top"><div class="mark"><span>&#9632;</span> SURGELABS</div><div>JavaScript &middot; Quiz</div></div>
<h1>Can JavaScript spell <span class="t">banana?</span><span class="sub">One line. One extra plus sign. What does it print?</span></h1>
<div class="code">
 <div class="hd">// node &nbsp;&middot;&nbsp; no tricks, just run it</div>
 <div class="ln"><span class="k">console</span>.log(<span class="s">'b'</span> + <span class="s">'a'</span> + +<span class="s">'a'</span> + <span class="s">'a'</span>)</div>
 <div class="out"><i>// prints</i> &nbsp;??????</div>
</div>
<div class="reply"><b>&gt;</b> Reply with your answer.</div>
<div class="foot"><b>surgeit.co.in</b> &middot; Follow @homingo.hackdays</div>
</div></body></html>
