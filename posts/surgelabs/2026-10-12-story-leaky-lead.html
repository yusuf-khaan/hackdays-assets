<!doctype html>

html,body{margin:0;background:var(--bg)}

.t{color:var(--teal)} .p{color:var(--purple)}
.sub{display:block;font-size:34px;line-height:1.35;color:var(--soft);font-weight:400;letter-spacing:0;margin-top:30px}
svg.d{position:absolute;left:0;top:800px}
.chip{position:absolute;left:72px;top:1530px;font-family:Mono;font-size:28px;color:var(--teal);border:2px solid var(--teal);border-radius:999px;padding:16px 30px}
