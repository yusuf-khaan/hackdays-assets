<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../tools/fonts.css">
<style>
:root{--bg:#08080A;--purple:#8B6CFF;--teal:#2DD4BF;--card:#111114;--line:#232329;--muted:#8A8A93}
.frame{background:var(--bg)}
.glow{position:absolute;left:-260px;top:-200px;width:900px;height:700px;background:radial-gradient(closest-side,rgba(139,108,255,.22),rgba(139,108,255,0))}
.glow2{position:absolute;right:-300px;bottom:-260px;width:900px;height:760px;background:radial-gradient(closest-side,rgba(45,212,191,.14),rgba(45,212,191,0))}
.top{position:absolute;left:72px;right:72px;top:64px;display:flex;justify-content:space-between;align-items:center;color:var(--muted)}
.brand{display:flex;align-items:center;gap:14px;color:#fff}
.brand i{width:16px;height:16px;background:var(--teal);border-radius:4px;display:block;box-shadow:0 0 18px rgba(45,212,191,.7)}
h1{position:absolute;left:72px;right:72px;top:150px;font-family:Sans;font-weight:600;font-size:92px;line-height:1.02;letter-spacing:-.035em;color:#fff}
h1 span{color:var(--teal)}
.card{position:absolute;left:72px;right:72px;top:520px;height:470px;background:var(--card);border:1px solid var(--line);border-radius:26px;overflow:hidden}
.card .hd{display:flex;justify-content:space-between;padding:26px 32px;border-bottom:1px solid var(--line);font-family:Mono;font-size:20px;color:#6B6B74}
.card .hd b{color:var(--teal);font-weight:500}
svg{position:absolute;left:0;top:76px}
.node{position:absolute;font-family:Mono;font-size:24px;padding:16px 24px;border-radius:14px;border:1px solid var(--line);background:#16161A;color:#E4E4E7}
.node.in::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--purple);margin-right:14px;vertical-align:2px;box-shadow:0 0 10px rgba(139,108,255,.9)}
.node.mid{border-color:rgba(139,108,255,.6);color:#fff;background:#1A1530}
.node.out{border-color:rgba(45,212,191,.7);color:var(--bg);background:var(--teal);font-weight:500}
.facts{position:absolute;left:72px;right:72px;top:1030px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.facts div{border-top:1px solid var(--line);padding-top:18px;font-size:24px;line-height:1.35;color:#D4D4D8}
.facts div small{display:block;font-family:Sans;font-weight:600;font-size:16px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.foot{position:absolute;left:72px;right:72px;bottom:64px;display:flex;justify-content:space-between;align-items:center}
.foot .url{font-family:Mono;font-size:24px;color:#fff}
.foot .url span{color:var(--teal)}
</style></head>
<body><div class="frame">
<div class="glow"></div><div class="glow2"></div>
<div class="top label"><div class="brand"><i></i>SurgeLabs</div><div>Now powering</div></div>

<h1>We're powering India's next <span>AI engineers.</span></h1>

<div class="card">
<div class="hd"><span>pipeline: homingo_hack_days</span><b>● live</b></div>
<svg width="936" height="394" viewBox="0 0 936 394">
<g fill="none" stroke-width="2">
<path d="M262 74 C 360 74, 330 196, 420 196" stroke="#8B6CFF" stroke-opacity=".7"/>
<path d="M262 196 L 420 196" stroke="#8B6CFF" stroke-opacity=".7"/>
<path d="M262 318 C 360 318, 330 196, 420 196" stroke="#8B6CFF" stroke-opacity=".7"/>
<path d="M650 196 L 690 196" stroke="#2DD4BF" stroke-opacity=".9"/>
</g>
<circle cx="420" cy="196" r="5" fill="#8B6CFF"/>
<circle cx="690" cy="196" r="5" fill="#2DD4BF"/>
</svg>
<div class="node in" style="left:32px;top:121px">agents</div>
<div class="node in" style="left:32px;top:243px">automation</div>
<div class="node in" style="left:32px;top:365px">llm_apps</div>
<div class="node mid" style="left:426px;top:243px">real problems</div>
<div class="node out" style="left:696px;top:243px">edition 01</div>
</div>

<div class="facts">
<div><small>Format</small>Online, open to all of India</div>
<div><small>Teams</small>Solo or teams of 2–4</div>
<div><small>Registrations close</small>15 Nov · 11:59 PM IST</div>
</div>

<div class="foot"><div class="url">hackathon<span>.</span>homingo.co.in</div><div class="label" style="color:var(--muted);font-size:18px">Homingo Hack Days</div></div>
<div class="grain"></div>
</div></body></html>
