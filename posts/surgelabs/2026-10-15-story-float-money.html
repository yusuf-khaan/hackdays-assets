<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>SurgeLabs story: float money</title>
<link rel="stylesheet" href="../../tools/fonts.css">
<style>
:root{--bg:#0A0A0C;--fg:#F2F2F0;--teal:#2DD4BF;--purple:#A78BFA;--muted:#9A9AA3;--soft:#C8C8CE;--line:#2A2A31;--grid:#16161B}
html,body{margin:0;background:var(--bg)}
.frame{width:1080px;height:1920px;position:relative;overflow:hidden;color:var(--fg);font-family:Sans;background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:90px 90px}
.glow{position:absolute;width:1100px;height:1000px;pointer-events:none}
.top{position:absolute;left:72px;right:72px;top:270px;display:flex;justify-content:space-between;align-items:center;font-family:Mono;font-size:22px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mark{font-family:Sans;font-weight:600;font-size:34px;letter-spacing:-.03em;text-transform:none;color:var(--fg)}
.mark span{color:var(--teal)}
h1{position:absolute;left:72px;right:72px;top:360px;font-size:104px;font-weight:600;letter-spacing:-.045em;line-height:1.02;margin:0}
.t{color:var(--teal)}
.sub{display:block;font-size:34px;line-height:1.35;color:var(--soft);font-weight:400;letter-spacing:0;margin-top:30px}
.term{position:absolute;left:72px;right:72px;top:960px;background:#111114;border:1px solid var(--line);border-radius:22px;padding:34px 38px;font-family:Mono;font-size:34px;line-height:1.7}
.term .c{color:var(--muted)}
.term .o{color:var(--purple)}
.term .bad{color:var(--teal)}
.fix{position:absolute;left:72px;right:72px;top:1310px;font-size:36px;line-height:1.35}
.fix b{color:var(--teal);font-weight:600}
.fix code{font-family:Mono;color:var(--purple)}
.tz{position:absolute;left:72px;right:72px;top:1450px;font-size:36px;line-height:1.35;color:var(--fg)}
.tz b{color:var(--teal);font-weight:600}
.chip{position:absolute;left:72px;top:1545px;font-family:Mono;font-size:26px;color:var(--teal);border:2px solid var(--teal);border-radius:999px;padding:14px 28px}
</style></head>
<body><div class="frame">
<div class="glow" style="left:-300px;top:-200px;background:radial-gradient(closest-side,rgba(139,108,255,.22),transparent)"></div>
<div class="glow" style="right:-400px;bottom:-200px;background:radial-gradient(closest-side,rgba(45,212,191,.14),transparent)"></div>
<div class="top"><div class="mark"><span>&#9632;</span> SURGELABS</div><div>Quick check</div></div>
<h1>0.1 + 0.2 is not <span class="t">0.3.</span><span class="sub">Run it in Python and see. Now imagine that on an invoice.</span></h1>
<div class="term"><div class="c">&gt;&gt;&gt; 0.1 + 0.2</div><div class="bad">0.30000000000000004</div><div class="c">&gt;&gt;&gt; 0.1 + 0.2 == 0.3</div><div class="o">False</div></div>
<div class="fix">Money belongs in whole units: <b>paise as integers</b>, or a decimal type.</div>
<div class="tz">Today's reel on our feed explains why. <b>Watch it.</b></div>
<div class="chip">surgeit.co.in</div>
</div></body></html>
