<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>SurgeLabs story 1: Math.max quiz</title>
<link rel="stylesheet" href="../../tools/fonts.css">
<style>
:root{--bg:#0A0A0C;--fg:#F2F2F0;--teal:#2DD4BF;--purple:#A78BFA;--muted:#9A9AA3;--soft:#C8C8CE;--line:#2A2A31;--grid:#16161B}
html,body{margin:0;background:var(--bg)}
.frame{width:1080px;height:1920px;position:relative;overflow:hidden;color:var(--fg);font-family:Sans;background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:90px 90px}
.glow{position:absolute;width:1100px;height:1000px;pointer-events:none}
.top{position:absolute;left:72px;right:72px;top:270px;display:flex;justify-content:space-between;align-items:center;font-family:Mono;font-size:22px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mark{font-family:Sans;font-weight:600;font-size:34px;letter-spacing:-.045em;text-transform:none;color:var(--fg)}
.mark span{color:var(--teal)}
h1{position:absolute;left:72px;right:72px;top:350px;font-size:96px;font-weight:600;letter-spacing:-.045em;line-height:1.05;margin:0}
.t{color:var(--teal)}
.sub{display:block;font-size:34px;line-height:1.35;color:var(--soft);font-weight:400;letter-spacing:0;margin-top:26px}
.code{position:absolute;left:72px;right:72px;top:660px;background:#111114;border:1px solid var(--line);border-radius:24px;padding:34px 40px;font-family:Mono;font-size:50px;font-weight:500}
.code .c{display:block;font-size:22px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;font-weight:400}
.code .p{color:var(--purple)}
.opts{position:absolute;left:72px;right:72px;top:900px;display:grid;grid-template-columns:1fr 1fr;gap:22px}
.o{background:#111114;border:1px solid var(--line);border-radius:20px;padding:26px 30px;font-family:Mono;font-size:46px;font-weight:500;display:flex;align-items:center;gap:22px}
.o b{width:60px;height:60px;border-radius:14px;background:#1B1B21;border:1px solid #34343C;display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--teal)}
.ask{position:absolute;left:72px;right:72px;top:1200px;font-size:34px;line-height:1.4;color:var(--soft)}
.ask b{color:var(--teal);font-weight:600}
.foot{position:absolute;left:72px;right:72px;top:1370px;font-family:Mono;font-size:23px;line-height:1.6;color:var(--muted)}
</style></head>
<body><div class="frame">
<div class="glow" style="left:-300px;top:-200px;background:radial-gradient(closest-side,rgba(139,108,255,.22),transparent)"></div>
<div class="glow" style="right:-400px;bottom:-200px;background:radial-gradient(closest-side,rgba(45,212,191,.14),transparent)"></div>
<div class="top"><div class="mark"><span>&#9632;</span> SURGELABS</div><div>JavaScript quiz</div></div>
<h1>What does this <span class="t">print?</span><span class="sub">No arguments. No array. Just a call.</span></h1>
<div class="code"><span class="c">JavaScript</span>console.log(<span class="p">Math.max</span>())</div>
<div class="opts">
<div class="o"><b>A</b>0</div><div class="o"><b>B</b>undefined</div>
<div class="o"><b>C</b>NaN</div><div class="o"><b>D</b>-Infinity</div>
</div>
<div class="ask"><b>Reply with your letter.</b> Hint: what is the biggest of nothing?</div>
<div class="foot">Follow @homingo.hackdays &middot; surgeit.co.in</div>
</div></body></html>
