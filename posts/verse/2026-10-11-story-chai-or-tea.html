<!doctype html>
<!-- verse story 1 · 2026-10-11 · word origin + map: "cha" by land, "te" by sea.
     Facts: WALS chapter 138 "Tea" (Östen Dahl), Quartz (2018). 1080×1920; top 250px and bottom 300px kept free of text. -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../tools/fonts.css">
<style>
:root{--lac:#0B0A0A;--cin:#C8372D;--jade:#3E8E7E;--gold:#C9A45C;--paper:#F1E8D6;--mute:#A39883}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--lac)}
.f{width:1080px;height:1920px;position:relative;overflow:hidden;background:var(--lac);color:var(--paper);font-family:Sans}
.h{font-family:Fraunces;font-weight:600;letter-spacing:-.025em;line-height:1.02}
.grain{position:absolute;inset:0;opacity:.08;pointer-events:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
</style></head><body><div class="f">
  <div style="position:absolute;left:80px;top:270px;font:600 24px Sans;letter-spacing:.24em;color:var(--gold)">WORD ORIGIN · CHINA</div>
  <div style="position:absolute;right:80px;top:250px;width:96px;height:96px;background:var(--cin);border-radius:8px;display:flex;align-items:center;justify-content:center;font:600 62px 'Noto Serif SC';color:#F6E7D8;box-shadow:inset 0 0 0 5px #C8372D,inset 0 0 0 8px #F6E7D8">茶</div>
  <div class="h" style="position:absolute;left:80px;top:370px;width:900px;font-size:112px">You say <span style="color:var(--gold)">chai.</span><br>London says <span style="color:#7FC4B4">tea.</span></div>
  <div style="position:absolute;left:80px;top:640px;width:900px;font:italic 400 60px/1.15 Fraunces;color:var(--paper)">Both words are Chinese. The difference is the road they took.</div>

  <svg style="position:absolute;left:40px;top:830px" width="1000" height="520" viewBox="0 0 1000 520">
    <!-- China -->
    <circle cx="880" cy="260" r="56" fill="#C8372D"/>
    <text x="880" y="280" text-anchor="middle" font-family="Noto Serif SC" font-weight="600" font-size="52" fill="#F6E7D8">茶</text>
    <text x="880" y="355" text-anchor="middle" font-family="Mono" font-size="22" fill="#F1E8D6">CHINA</text>
    <!-- land route -->
    <path d="M824 240 C700 150 560 120 440 140 C330 158 250 120 150 110" fill="none" stroke="#C9A45C" stroke-width="7" stroke-linecap="round"/>
    <circle cx="440" cy="140" r="12" fill="#C9A45C"/><circle cx="150" cy="110" r="14" fill="#C9A45C"/>
    <text x="640" y="110" text-anchor="middle" font-family="Mono" font-size="22" fill="#C9A45C">BY LAND · SILK ROAD</text>
    <text x="440" y="200" text-anchor="middle" font-family="Sans" font-weight="600" font-size="30" fill="#F1E8D6">Persian chāy</text>
    <text x="150" y="60" text-anchor="middle" font-family="Fraunces" font-weight="600" font-size="46" fill="#C9A45C">chai</text>
    <text x="150" y="168" text-anchor="middle" font-family="Mono" font-size="20" fill="#F1E8D6">HINDI · URDU</text>
    <text x="600" y="60" text-anchor="middle" font-family="Fraunces" font-style="italic" font-size="34" fill="#C9A45C">from “cha”</text>
    <!-- sea route -->
    <path d="M840 300 C760 420 600 470 450 450 C330 434 240 420 150 400" fill="none" stroke="#3E8E7E" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 16"/>
    <circle cx="450" cy="450" r="12" fill="#3E8E7E"/><circle cx="150" cy="400" r="14" fill="#3E8E7E"/>
    <text x="660" y="500" text-anchor="middle" font-family="Mono" font-size="22" fill="#7FC4B4">BY SEA · DUTCH SHIPS</text>
    <text x="450" y="410" text-anchor="middle" font-family="Sans" font-weight="600" font-size="30" fill="#F1E8D6">Dutch thee</text>
    <text x="150" y="360" text-anchor="middle" font-family="Fraunces" font-weight="600" font-size="46" fill="#7FC4B4">tea</text>
    <text x="150" y="458" text-anchor="middle" font-family="Mono" font-size="20" fill="#F1E8D6">ENGLISH</text>
    <text x="640" y="330" text-anchor="middle" font-family="Fraunces" font-style="italic" font-size="34" fill="#7FC4B4">from coastal “te”</text>
  </svg>
  <div style="position:absolute;right:80px;top:1360px;font:500 18px Mono;letter-spacing:.12em;color:var(--mute)">ILLUSTRATION · NOT TO SCALE</div>

  <div style="position:absolute;left:80px;top:1410px;width:920px;font:400 36px/1.4 Sans;color:#E2D8C4">Of 230 languages in the World Atlas of Language Structures, 110 use a “cha” word and 84 a “te” word.</div>
  <div style="position:absolute;left:80px;top:1540px;width:920px;font:600 34px/1.3 Sans;color:var(--gold)">Today on our feed: a tomb nobody has opened →</div>
  <div class="grain"></div>
</div></body></html>
