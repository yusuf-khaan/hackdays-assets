<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Homingo story: the phone in the drawer</title>
<link rel="stylesheet" href="../../tools/fonts.css">
<style>
:root{--bg:#F5F6FA;--blue:#2563EB;--ink:#111827;--grey:#6B7280}
html,body{margin:0;background:var(--bg)}
.f{width:1080px;height:1920px;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Sans}
.lab{position:absolute;left:80px;top:270px;font:500 24px Mono;letter-spacing:.18em;color:var(--blue);text-transform:uppercase}
.h{position:absolute;left:80px;right:80px;top:340px;font-family:"Serif";font-size:132px;line-height:.96;letter-spacing:-.025em}
.h em{color:var(--blue);font-style:italic}
.h .s{display:block;font-family:Sans;font-size:38px;line-height:1.35;letter-spacing:0;color:var(--grey);margin-top:30px}
.ill{position:absolute;left:60px;top:880px;width:960px;height:520px}
.sell{position:absolute;left:540px;top:1430px;width:190px;height:150px;overflow:hidden;border-radius:44px;background:#fff;box-shadow:0 20px 50px rgba(37,99,235,.25)}
.sell img{position:absolute;width:738px;left:-269px;top:-1398px;left:-275px}
.cta{position:absolute;left:80px;top:1420px;width:440px}
.cta img{width:96px;height:96px;border-radius:24px;box-shadow:0 12px 30px rgba(37,99,235,.24)}
.cta .t{font:600 44px/1.15 Sans;margin-top:22px}
.cta .t small{display:block;font:400 26px/1.3 Sans;color:var(--grey);margin-top:8px}
.link{position:absolute;left:770px;top:1470px;font:italic 400 54px "Serif";color:var(--blue)}
</style></head>
<body><div class="f">
<div class="lab">Homingo · Let it go</div>
<div class="h">The phone in your drawer is <em>still</em> waiting.<span class="s">Phones and electronics sell on Homingo. Tap Sell, add a photo and a price.</span></div>
<svg class="ill" viewBox="0 0 960 520" fill="none">
 <ellipse cx="480" cy="480" rx="400" ry="22" fill="#111827" opacity=".07"/>
 <!-- cabinet -->
 <rect x="110" y="150" width="740" height="320" rx="36" fill="#fff" stroke="#DCE6FD" stroke-width="4"/>
 <!-- open drawer interior -->
 <rect x="150" y="190" width="660" height="150" rx="22" fill="#EEF3FE"/>
 <!-- cable -->
 <path d="M200 300 C260 250 330 340 400 290 S520 250 560 300" stroke="#93B4F8" stroke-width="10" stroke-linecap="round"/>
 <rect x="188" y="288" width="34" height="26" rx="6" fill="#3B76F0"/>
 <!-- phone, lying tilted -->
 <g transform="rotate(-14 640 250)">
  <rect x="560" y="120" width="170" height="270" rx="30" fill="#111827"/>
  <rect x="572" y="134" width="146" height="242" rx="20" fill="#2563EB" opacity=".9"/>
  <rect x="620" y="142" width="50" height="9" rx="4.5" fill="#111827"/>
  <path d="M590 340 L690 180" stroke="#fff" stroke-width="5" opacity=".35"/>
 </g>
 <!-- coin / earbud case -->
 <circle cx="300" cy="245" r="26" fill="#fff" stroke="#93B4F8" stroke-width="4"/>
 <!-- drawer front -->
 <rect x="150" y="320" width="660" height="110" rx="22" fill="#fff" stroke="#93B4F8" stroke-width="4"/>
 <rect x="400" y="362" width="160" height="26" rx="13" fill="#2563EB"/>
 <!-- dust dots -->
 <g fill="#93B4F8"><circle cx="880" cy="110" r="6"/><circle cx="905" cy="150" r="4"/><circle cx="850" cy="150" r="3"/></g>
 <text x="40" y="80" font-family="Mono" font-size="22" letter-spacing="3" fill="#6B7280">DRAWER · SINCE THE UPGRADE</text>
</svg>
<div class="cta"><img src="../../brand/homingo-app/app-icon.png" alt=""><div class="t">Tap Sell. List it free.<small>Homingo · Lucknow's local marketplace</small></div></div>
<div class="sell"><img src="../../brand/homingo-app/home.jpg" alt=""></div>
<div class="link">Link in bio</div>
</div></body></html>
