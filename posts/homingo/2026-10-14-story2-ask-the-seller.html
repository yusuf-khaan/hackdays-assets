<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Homingo story: ask the seller</title>
<link rel="stylesheet" href="../../tools/fonts.css">
<style>
:root{--bg:#F5F6FA;--blue:#2563EB;--ink:#111827;--grey:#6B7280}
html,body{margin:0;background:var(--bg)}
.f{width:1080px;height:1920px;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Sans}
.lab{position:absolute;left:80px;top:270px;font:500 24px Mono;letter-spacing:.18em;color:var(--blue);text-transform:uppercase}
.h{position:absolute;left:80px;right:80px;top:340px;font-family:"Serif";font-size:124px;line-height:.95;letter-spacing:-.025em}
.h em{color:var(--blue);font-style:italic;display:block}
.h .s{display:block;font-family:Sans;font-size:38px;line-height:1.35;letter-spacing:0;color:var(--grey);margin-top:30px}
.phone{position:absolute;left:80px;top:872px;width:340px;height:748px;border-radius:44px 44px 0 0;border:10px solid var(--ink);border-bottom:none;background:#fff;overflow:hidden;box-shadow:0 30px 70px rgba(37,99,235,.18);transform:rotate(-2deg);transform-origin:bottom left}
.phone img{width:340px;display:block}
.side{position:absolute;left:520px;right:70px;top:930px}
.pill{border-radius:999px;font:600 38px Sans;text-align:center;padding:30px 0}
.p1{background:var(--blue);color:#fff;box-shadow:0 14px 34px rgba(37,99,235,.3)}
.p2{margin-top:22px;border:2px solid #E5E7EB;background:#fff;color:var(--blue)}
.note{font:500 36px/1.3 Sans;margin-top:40px}
.note small{display:block;font:400 28px/1.35 Sans;color:var(--grey);margin-top:12px}
.ic{display:flex;align-items:center;gap:24px;margin-top:56px}
.ic img{width:110px;height:110px;border-radius:26px;box-shadow:0 14px 34px rgba(37,99,235,.2)}
.ic .b2{font:italic 400 60px "Serif";color:var(--blue)}
.ic small{display:block;font:400 24px Sans;color:var(--grey);margin-top:6px;font-style:normal}
</style></head>
<body><div class="f">
<div class="lab">Homingo · Lucknow</div>
<div class="h">Love it? Ask the seller <em>yourself.</em><span class="s">You talk to the person who listed it.</span></div>
<div class="phone"><img src="../../brand/homingo-app/listing.jpg" alt="Homingo listing screen with Chat with seller and Call buttons"></div>
<div class="side"><div class="pill p1">Chat with seller</div><div class="pill p2">Call</div>
<div class="note">Your enquiry goes straight to them.<small>Homingo · Lucknow's local marketplace</small></div>
<div class="ic"><img src="../../brand/homingo-app/app-icon.png" alt=""><div class="b2">Link in bio</div></div></div>
</div></body></html>
