<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Homingo story: one tap</title>
<link rel="stylesheet" href="../../tools/fonts.css">
<style>
:root{--bg:#F5F6FA;--blue:#2563EB;--ink:#111827;--grey:#6B7280}
html,body{margin:0;background:var(--bg)}
.f{width:1080px;height:1920px;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Sans}
.lab{position:absolute;left:80px;top:270px;font:500 24px Mono;letter-spacing:.18em;color:var(--blue);text-transform:uppercase}
.h{position:absolute;left:80px;right:80px;top:340px;font-family:"Serif";font-size:132px;line-height:.97;letter-spacing:-.025em}
.h em{color:var(--blue);font-style:italic}
.h .s{display:block;font-family:Sans;font-size:38px;line-height:1.35;letter-spacing:0;color:var(--grey);margin-top:30px}
.ring{position:absolute;left:50%;border-radius:50%;transform:translate(-50%,-50%)}
.btn{position:absolute;left:50%;top:1130px;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;background:var(--blue);box-shadow:0 30px 70px rgba(37,99,235,.4);border:14px solid #fff}
.btn:before,.btn:after{content:"";position:absolute;left:50%;top:50%;background:#fff;border-radius:10px;transform:translate(-50%,-50%)}
.btn:before{width:120px;height:20px}.btn:after{width:20px;height:120px}
.sell{position:absolute;left:0;right:0;top:1306px;text-align:center;font:500 40px Sans;color:var(--grey)}
.foot{position:absolute;left:80px;right:80px;top:1520px;height:90px}
.foot img{position:absolute;left:0;top:0;width:86px;height:86px;border-radius:22px;box-shadow:0 10px 26px rgba(37,99,235,.25)}
.foot .t{position:absolute;left:112px;top:6px;font:400 24px/1.35 Sans;color:var(--grey)}
.foot .t b{display:block;font:600 30px Sans;color:var(--ink)}
.foot .l{position:absolute;right:0;top:4px;font:italic 400 60px "Serif";color:var(--blue)}
</style></head>
<body><div class="f">
<div class="lab">Homingo &middot; The Sell button</div>
<div class="h">The smallest button. The <em>biggest</em> clear-out.<span class="s">Tap Sell, add a photo and a price. Listing is free.</span></div>
<div class="ring" style="top:1130px;width:700px;height:700px;background:#EEF3FE"></div>
<div class="ring" style="top:1130px;width:540px;height:540px;background:#DCE6FD"></div>
<div class="btn"></div><div class="sell">Sell</div>
<div class="foot"><img src="../../brand/homingo-app/app-icon.png" alt=""><div class="t"><b>List it free on Homingo</b>Lucknow's local marketplace</div><div class="l">Link in bio</div></div>
</div></body></html>
