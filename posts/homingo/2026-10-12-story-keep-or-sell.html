<link rel="stylesheet" href="../../tools/fonts.css">
<style>
:root{--bg:#F5F6FA;--blue:#2563EB;--ink:#111827;--grey:#6B7280}
html,body{margin:0;background:var(--bg)}
.f{width:1080px;height:1920px;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Sans}
.lab{position:absolute;left:80px;top:270px;font:500 24px Mono;letter-spacing:.18em;color:var(--blue);text-transform:uppercase}
.h{position:absolute;left:80px;right:80px;top:340px;font-family:"Serif";font-size:150px;line-height:.95;letter-spacing:-.02em}

.pin{position:absolute;left:190px;top:740px;width:700px;height:520px;background:#fff;border-radius:40px;box-shadow:0 30px 70px rgba(37,99,235,.16),0 4px 12px rgba(17,24,39,.06);transform:rotate(-3deg)}
.tag{position:absolute;right:50px;top:40px;background:var(--blue);color:#fff;font:500 24px Mono;letter-spacing:.1em;padding:12px 22px;border-radius:999px}
.pills{position:absolute;left:110px;right:110px;top:1310px;display:flex;gap:30px}
.p{flex:1;text-align:center;border-radius:999px;padding:34px 0;font:600 40px Sans}
.k{background:#fff;color:var(--grey);border:2px solid #E5E7EB}
.s2{background:var(--blue);color:#fff;box-shadow:0 18px 40px rgba(37,99,235,.35)}
.cta{position:absolute;left:80px;right:80px;top:1470px;display:flex;align-items:center;gap:26px}
.cta img{width:100px;height:100px;border-radius:24px}
.cta .t{font:600 38px/1.2 Sans}
.cta .t small{display:block;font:400 26px Sans;color:var(--grey);margin-top:6px}
.cta .b{margin-left:auto;font:italic 400 44px "Serif";color:var(--blue)}
</style></head>
