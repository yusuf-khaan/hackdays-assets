<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Homingo story: room for one more</title>
<link rel="stylesheet" href="../../tools/fonts.css">
<style>
:root{--bg:#F5F6FA;--blue:#2563EB;--ink:#111827;--grey:#6B7280}
html,body{margin:0;background:var(--bg)}
.f{width:1080px;height:1920px;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Sans}
.lab{position:absolute;left:80px;top:270px;font:500 24px Mono;letter-spacing:.18em;color:var(--blue);text-transform:uppercase}
.h{position:absolute;left:80px;right:80px;top:340px;font-family:"Serif";font-size:132px;line-height:.96;letter-spacing:-.025em}

.ph{position:absolute;left:520px;top:800px;width:480px;height:945px;border-radius:64px;background:var(--ink);padding:12px;box-sizing:border-box;box-shadow:0 40px 90px rgba(37,99,235,.28)}

.scr img{position:absolute;width:456px;left:0;top:-68px}
.ring{position:absolute;left:178px;top:792px;width:100px;height:100px;border-radius:50%;border:6px solid var(--blue);box-shadow:0 0 0 10px rgba(37,99,235,.18)}
.cta{position:absolute;left:80px;top:1000px;width:400px}
.cta img{width:110px;height:110px;border-radius:28px;box-shadow:0 12px 30px rgba(37,99,235,.24)}
.cta .t{font:600 52px/1.12 Sans;margin-top:26px;letter-spacing:-.02em}
.cta .t small{display:block;font:400 30px/1.35 Sans;color:var(--grey);margin-top:14px;letter-spacing:0}
.link{position:absolute;left:80px;top:1480px;font:italic 400 64px "Serif";color:var(--blue)}
.ar{position:absolute;left:360px;top:1560px;width:300px;height:200px}
</style></head>
<body><div class="f">
<div class="lab">Homingo &middot; Let it go</div>
<div class="h">1K+ listings.<br>Room for <em>one more.</em><span class="s">List your unused things here. Tap Sell, add a photo and a price.</span></div>
<div class="cta"><img src="../../brand/homingo-app/app-icon.png" alt=""><div class="t">List it free.<small>Homingo &middot; Lucknow's local marketplace</small></div></div>
<div class="link">Link in bio</div>
<div class="ph"><div class="scr"><img src="../../brand/homingo-app/home.jpg" alt=""><div class="ring"></div></div></div>
</div></body></html>
