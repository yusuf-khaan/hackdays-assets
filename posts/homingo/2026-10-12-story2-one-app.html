<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Homingo story: 1K+ listings</title>
<link rel="stylesheet" href="../../tools/fonts.css">
<style>
:root{--bg:#F5F6FA;--blue:#2563EB;--ink:#111827;--grey:#6B7280}
html,body{margin:0;background:var(--bg)}
.f{width:1080px;height:1920px;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Sans}
.lab{position:absolute;left:80px;top:270px;font:500 24px Mono;letter-spacing:.18em;color:var(--blue);text-transform:uppercase}
.h{position:absolute;left:80px;right:80px;top:340px;font-family:"Serif";font-size:220px;line-height:.9;letter-spacing:-.03em;color:var(--blue)}
.h .s{display:block;font-family:"Serif";font-size:96px;line-height:1;letter-spacing:-.02em;color:var(--ink);margin-top:14px}
.h .s em{color:var(--blue);font-style:italic}
.h .s2{display:block;font-family:Sans;font-size:36px;line-height:1.35;letter-spacing:0;color:var(--grey);margin-top:28px}
.chips{position:absolute;left:80px;right:80px;top:1000px;display:flex;flex-wrap:wrap;gap:22px}
.c{background:#fff;border-radius:999px;padding:24px 40px;font:600 38px Sans;box-shadow:0 14px 34px rgba(37,99,235,.12),0 2px 6px rgba(17,24,39,.05)}
.c.b{background:var(--blue);color:#fff}
.c:nth-child(odd){transform:rotate(-1.5deg)}.c:nth-child(even){transform:rotate(1.5deg)}
.free{position:absolute;left:80px;right:80px;top:1330px;font-size:40px;line-height:1.35;color:var(--ink)}
.free b{color:var(--blue);font-weight:600}
.cta{position:absolute;left:80px;right:80px;top:1470px;display:flex;align-items:center;gap:26px}
.cta img{width:100px;height:100px;border-radius:24px}
.cta .t{font:600 38px/1.2 Sans}
.cta .t small{display:block;font:400 26px Sans;color:var(--grey);margin-top:6px}
.cta .b2{margin-left:auto;font:italic 400 44px "Serif";color:var(--blue)}
</style></head>
<body><div class="f">
<div class="lab">Homingo · Lucknow</div>
<div class="h">1K+<span class="s">active <em>listings.</em></span><span class="s2">Rooms to bikes, in one local app.</span></div>
<div class="chips"><div class="c b">Rooms</div><div class="c">Flats</div><div class="c">PGs</div><div class="c">Bikes</div><div class="c">Cars</div><div class="c">Phones</div><div class="c">Furniture</div></div>
<div class="free">Search, filter by <b>budget and distance</b>, then call or chat the seller directly.</div>
<div class="cta"><img src="../../brand/homingo-app/app-icon.png" alt=""><div class="t">Listing is free.<small>Homingo · Lucknow's local marketplace</small></div><div class="b2">Link in bio</div></div>
</div></body></html>
