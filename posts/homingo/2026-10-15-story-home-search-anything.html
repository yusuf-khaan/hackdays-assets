<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Homingo story: home search anything</title>
<link rel="stylesheet" href="../../tools/fonts.css">
<style>
:root{--bg:#F5F6FA;--blue:#2563EB;--ink:#111827;--grey:#6B7280}
html,body{margin:0;background:var(--bg)}
.f{width:1080px;height:1920px;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Sans}
.lab{position:absolute;left:80px;top:270px;font:500 24px Mono;letter-spacing:.18em;color:var(--blue);text-transform:uppercase}
.h{position:absolute;left:80px;right:80px;top:340px;font-family:"Serif";font-size:130px;line-height:.96;letter-spacing:-.025em}
.h em{color:var(--blue);font-style:italic}
.h .s{display:block;font-family:Sans;font-size:38px;line-height:1.35;letter-spacing:0;color:var(--grey);margin-top:30px}
.ph{position:absolute;left:80px;top:960px;width:520px;height:620px;overflow:hidden;border-radius:40px;box-shadow:0 34px 80px rgba(37,99,235,.22);transform:rotate(-2.5deg);background:#fff}
.ph img{position:absolute;left:0;top:-88px;width:520px}
.side{position:absolute;left:660px;right:80px;top:1130px}
.side img{width:120px;height:120px;border-radius:30px;box-shadow:0 14px 34px rgba(37,99,235,.24)}
.side .t{font:600 44px/1.15 Sans;margin-top:26px}
.side .t small{display:block;font:400 26px/1.3 Sans;color:var(--grey);margin-top:10px}
.side .l{font:italic 400 60px "Serif";color:var(--blue);margin-top:26px}
</style></head>
<body><div class="f">
<div class="lab">Homingo · Lucknow</div>
<div class="h">Search for <em>anything.</em><span class="s">Rooms, flats and PGs to bikes, phones and furniture. One local app.</span></div>
<div class="ph"><img src="../../brand/homingo-app/home.jpg" alt=""></div>
<div class="side"><img src="../../brand/homingo-app/app-icon.png" alt=""><div class="t">Tap Sell. List it free.<small>Homingo · Lucknow's local marketplace</small></div><div class="l">Link in bio</div></div>
</div></body></html>
