<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Homingo story: budget and distance</title>
<link rel="stylesheet" href="../../tools/fonts.css">
<style>
:root{--bg:#F5F6FA;--blue:#2563EB;--ink:#111827;--grey:#6B7280}
html,body{margin:0;background:var(--bg)}
.f{width:1080px;height:1920px;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Sans}
.lab{position:absolute;left:80px;top:270px;font:500 24px Mono;letter-spacing:.18em;color:var(--blue);text-transform:uppercase}
.h{position:absolute;left:80px;right:80px;top:340px;font-family:"Serif";font-size:128px;line-height:.98;letter-spacing:-.025em}
.h em{color:var(--blue);font-style:italic}
.h .s{display:block;font-family:Sans;font-size:38px;line-height:1.35;letter-spacing:0;color:var(--grey);margin-top:30px}
.card{position:absolute;left:70px;top:750px;width:780px;height:452px;overflow:hidden;border-radius:36px;background:#fff;box-shadow:0 30px 70px rgba(37,99,235,.2);transform:rotate(-2deg)}
.card img{position:absolute;left:0;top:-294px;width:780px}
.ring{position:absolute;left:20px;top:354px;width:696px;height:86px;border:5px solid var(--blue);border-radius:40px;box-sizing:border-box}
.c2{position:absolute;left:340px;top:1200px;width:520px;height:316px;overflow:hidden;border-radius:32px;background:#F5F6FA;box-shadow:0 30px 70px rgba(37,99,235,.28);transform:rotate(1.5deg)}
.c2 img{position:absolute;left:0;top:-507px;width:520px}
.cta{position:absolute;left:80px;right:80px;top:1536px;display:flex;align-items:center;gap:28px}
.cta img{width:76px;height:76px;border-radius:26px;box-shadow:0 12px 30px rgba(37,99,235,.24)}
.cta .t{font:600 38px/1.15 Sans}
.cta .t small{display:block;font:400 24px/1.3 Sans;color:var(--grey);margin-top:6px}
.cta .l{margin-left:auto;font:italic 400 58px "Serif";color:var(--blue)}
</style></head>
<body><div class="f">
<div class="lab">Homingo · Find it here</div>
<div class="h">Your budget. Your distance. Your <em>room.</em><span class="s">Search rooms, flats and PGs in Lucknow. Filter by budget and distance.</span></div>
<div class="card"><img src="../../brand/homingo-app/home.jpg" alt=""><div class="ring"></div></div>
<div class="c2"><img src="../../brand/homingo-app/listing-rental.png" alt=""></div>
<div class="cta"><img src="../../brand/homingo-app/app-icon.png" alt=""><div class="t">Find it on Homingo<small>Lucknow's local marketplace</small></div><div class="l">Link in bio</div></div>
</div></body></html>
