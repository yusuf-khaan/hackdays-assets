<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Homingo story: type what you need</title>
<link rel="stylesheet" href="../../tools/fonts.css">
<style>
:root{--bg:#F5F6FA;--blue:#2563EB;--ink:#111827;--grey:#6B7280}
html,body{margin:0;background:var(--bg)}
.f{width:1080px;height:1920px;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Sans}
.lab{position:absolute;left:80px;top:270px;font:500 24px Mono;letter-spacing:.18em;color:var(--blue);text-transform:uppercase}
.h{position:absolute;left:80px;right:80px;top:330px;font-family:"Serif";font-size:116px;line-height:.97;letter-spacing:-.025em}
.h em{color:var(--blue);font-style:italic}
.h .s{display:block;font-family:Sans;font-size:36px;line-height:1.35;letter-spacing:0;color:var(--grey);margin-top:28px}
.ph{position:absolute;left:245px;top:790px;width:590px;height:600px;border-radius:44px;overflow:hidden;background:#fff;box-shadow:0 34px 80px rgba(37,99,235,.22);transform:rotate(-1.6deg);border:8px solid #fff}
.ph img{position:absolute;left:0;top:-96px;width:590px}
.ring{position:absolute;left:14px;top:84px;width:466px;height:84px;border:5px solid var(--blue);border-radius:999px;box-shadow:0 0 0 8px rgba(37,99,235,.15)}
.pill{position:absolute;left:300px;top:1430px;background:var(--blue);color:#fff;font:600 30px Sans;padding:18px 36px;border-radius:999px;box-shadow:0 18px 40px rgba(37,99,235,.3);z-index:2}
.pill2{position:absolute;left:80px;top:730px;background:#fff;color:var(--ink);font:600 30px Sans;padding:18px 34px;border-radius:999px;border:2px solid #E5E7EB;box-shadow:0 14px 34px rgba(37,99,235,.12);z-index:2}
.foot{position:absolute;left:80px;right:80px;top:1545px;height:80px}
.foot img{position:absolute;left:0;top:0;width:76px;height:76px;border-radius:20px;box-shadow:0 10px 26px rgba(37,99,235,.25)}
.foot .t{position:absolute;left:100px;top:4px;font:400 24px/1.3 Sans;color:var(--grey)}
.foot .t b{display:block;font:600 30px Sans;color:var(--ink)}
.foot .l{position:absolute;right:0;top:6px;font:italic 400 58px "Serif";color:var(--blue)}
</style></head>
<body><div class="f">
<div class="lab">Find it here &middot; Lucknow</div>
<div class="h">Need a room? Just type <em>"rent".</em><span class="s">Then filter by budget and distance.</span></div>
<div class="pill2">Search in Lucknow</div>
<div class="ph"><img src="../../brand/homingo-app/search-rent.jpg" alt=""><div class="ring"></div></div>
<div class="pill">Budget first. Then distance.</div>
<div class="foot"><img src="../../brand/homingo-app/app-icon.png" alt=""><div class="t"><b>Get Homingo</b>Lucknow's local marketplace</div><div class="l">Link in bio</div></div>
</div></body></html>
