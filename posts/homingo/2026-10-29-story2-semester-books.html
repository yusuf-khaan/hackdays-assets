<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Homingo story 2: semester books</title>
<link rel="stylesheet" href="../../tools/fonts.css">
<style>
:root{--bg:#F5F6FA;--blue:#2563EB;--ink:#111827;--grey:#6B7280}
html,body{margin:0;background:var(--bg)}
.f{width:1080px;height:1920px;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Sans}
.lab{position:absolute;left:80px;top:270px;font:500 24px Mono;letter-spacing:.18em;color:var(--blue);text-transform:uppercase}
.h{position:absolute;left:80px;right:80px;top:330px;font-family:"Serif";font-size:124px;line-height:.97;letter-spacing:-.025em}
.h em{color:var(--blue);font-style:italic}
.h .s{display:block;font-family:Sans;font-size:36px;line-height:1.35;letter-spacing:0;color:var(--grey);margin-top:28px}
.card{position:absolute;left:150px;top:880px;width:780px;height:600px;background:#fff;border-radius:44px;box-shadow:0 34px 80px rgba(37,99,235,.2);transform:rotate(-1.6deg)}
.shelf{position:absolute;left:60px;right:60px;top:480px;height:16px;border-radius:8px;background:#DCE6FD}
.bk{position:absolute;border-radius:10px 10px 6px 6px}
.bk i{position:absolute;left:14%;right:14%;top:18%;height:12px;border-radius:6px;background:rgba(255,255,255,.7)}
.bk i+i{top:30%;opacity:.5;right:30%}
.pill{position:absolute;left:60px;top:830px;background:var(--blue);color:#fff;font:600 30px Sans;padding:18px 36px;border-radius:999px;box-shadow:0 18px 40px rgba(37,99,235,.3)}
.lbl{position:absolute;right:34px;top:34px;font:500 20px Mono;color:var(--grey)}
.tag{position:absolute;left:470px;top:70px;background:#EEF3FE;border:2px dashed #93B4F8;color:var(--blue);font:600 28px Sans;padding:14px 26px;border-radius:16px;transform:rotate(4deg)}
.foot{position:absolute;left:80px;right:80px;top:1540px;height:80px}
.foot img{position:absolute;left:0;top:0;width:76px;height:76px;border-radius:20px;box-shadow:0 10px 26px rgba(37,99,235,.25)}
.foot .t{position:absolute;left:100px;top:4px;font:400 24px/1.3 Sans;color:var(--grey)}
.foot .t b{display:block;font:600 30px Sans;color:var(--ink)}
.foot .l{position:absolute;right:0;top:6px;font:italic 400 58px "Serif";color:var(--blue)}
</style></head>
<body><div class="f">
<div class="lab">Let it go &middot; Lucknow</div>
<div class="h">Semester over. Your books <em>aren't.</em><span class="s">Someone is starting your course next. Tap Sell, add a photo and a price. Listing is free.</span></div>
<div class="card">
 <div class="lbl">Illustration</div>
 <div class="tag">Next semester?</div>
 <div class="shelf"></div>
 <!-- stack on the shelf: bottoms at y=430 -->
 <div class="bk" style="left:90px;top:280px;width:230px;height:200px;background:#1D4ED8"><i></i><i></i></div>
 <div class="bk" style="left:110px;top:220px;width:200px;height:60px;background:#3B76F0"><i style="top:36%"></i></div>
 <div class="bk" style="left:100px;top:162px;width:180px;height:58px;background:#93B4F8"><i style="top:36%;background:#fff"></i></div>
 <div class="bk" style="left:340px;top:250px;width:70px;height:230px;background:#2563EB"><i style="left:30%;right:30%"></i></div>
 <div class="bk" style="left:420px;top:290px;width:62px;height:190px;background:#93B4F8"><i style="left:30%;right:30%;background:#fff"></i></div>
 <div class="bk" style="left:492px;top:220px;width:78px;height:260px;background:#1D4ED8"><i style="left:30%;right:30%"></i></div>
 <div class="bk" style="left:585px;top:265px;width:66px;height:215px;background:#3B76F0;transform:rotate(7deg);transform-origin:bottom left"><i style="left:30%;right:30%"></i></div>
</div>
<div class="pill" style="left:230px;top:1400px">+ Sell</div>
<div class="foot"><img src="../../brand/homingo-app/app-icon.png" alt=""><div class="t"><b>List it free on Homingo</b>Lucknow's local marketplace</div><div class="l">Link in bio</div></div>
</div></body></html>
