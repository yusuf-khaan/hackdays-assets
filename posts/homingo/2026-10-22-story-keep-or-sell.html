<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Homingo story: keep it or sell it</title>
<link rel="stylesheet" href="../../tools/fonts.css">
<style>
:root{--bg:#F5F6FA;--blue:#2563EB;--ink:#111827;--grey:#6B7280}
html,body{margin:0;background:var(--bg)}
.f{width:1080px;height:1920px;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Sans}
.lab{position:absolute;left:80px;top:270px;font:500 24px Mono;letter-spacing:.18em;color:var(--blue);text-transform:uppercase}
.h{position:absolute;left:80px;right:80px;top:340px;font-family:"Serif";font-size:150px;line-height:.95;letter-spacing:-.025em}

.pin{position:absolute;left:150px;top:760px;width:780px;height:560px;background:#fff;border-radius:44px;box-shadow:0 34px 80px rgba(37,99,235,.22);transform:rotate(-2deg)}
.pin svg{position:absolute;left:0;top:0}
.ill{position:absolute;right:34px;top:26px;font:400 20px Mono;color:var(--grey);letter-spacing:.08em}
.pills{position:absolute;left:80px;right:80px;top:1380px;display:flex;gap:28px}

.pills span.on{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 16px 34px rgba(37,99,235,.35)}
.foot{position:absolute;left:80px;right:80px;top:1520px;height:90px;z-index:3}
.foot img{position:absolute;left:0;top:0;width:86px;height:86px;border-radius:22px;box-shadow:0 10px 26px rgba(37,99,235,.25)}
.foot .t{position:absolute;left:112px;top:6px;font:400 24px/1.35 Sans;color:var(--grey)}
.foot .t b{display:block;font:600 30px Sans;color:var(--ink)}
.foot .l{position:absolute;right:0;top:4px;font:italic 400 60px "Serif";color:var(--blue)}
</style></head>
<body><div class="f">
