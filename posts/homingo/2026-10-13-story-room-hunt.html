<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Homingo story: room hunt</title>
<link rel="stylesheet" href="../../tools/fonts.css">
<style>
:root{--bg:#F5F6FA;--blue:#2563EB;--ink:#111827;--grey:#6B7280}
html,body{margin:0;background:var(--bg)}
.f{width:1080px;height:1920px;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Sans}
.lab{position:absolute;left:80px;top:270px;font:500 24px Mono;letter-spacing:.18em;color:var(--blue);text-transform:uppercase}
.h{position:absolute;left:80px;right:80px;top:340px;font-family:"Serif";font-size:132px;line-height:.95;letter-spacing:-.025em}
.h em{color:var(--blue);font-style:italic;display:block;white-space:nowrap}
.h .s{display:block;font-family:Sans;font-size:38px;line-height:1.35;letter-spacing:0;color:var(--grey);margin-top:30px}
.phone{position:absolute;left:80px;top:900px;width:540px;height:720px;border-radius:56px 56px 0 0;border:12px solid var(--ink);border-bottom:none;background:#fff;overflow:hidden;box-shadow:0 30px 70px rgba(37,99,235,.18);transform:rotate(-2deg);transform-origin:bottom left}
.phone img{width:516px;display:block;margin-top:0}
.side{position:absolute;left:670px;right:70px;top:1130px}
.side img{width:130px;height:130px;border-radius:30px;box-shadow:0 14px 34px rgba(37,99,235,.2)}
.side .t{font:600 44px/1.2 Sans;margin-top:30px}
.side .t small{display:block;font:400 28px/1.35 Sans;color:var(--grey);margin-top:10px}
.side .b2{font:italic 400 64px "Serif";color:var(--blue);margin-top:36px}
</style></head>
<body><div class="f">
<div class="lab">Homingo · Lucknow</div>
<div class="h">Room hunting in Lucknow? <em>See it. Call it.</em><span class="s">Rooms, flats and PGs, with the price and the area up front.</span></div>
<div class="phone"><img src="../../brand/homingo-app/listing-rental.png" alt="Homingo listing screen"></div>
<div class="side"><img src="../../brand/homingo-app/app-icon.png" alt=""><div class="t">Call or chat the seller directly.<small>Homingo · Lucknow's local marketplace</small></div><div class="b2">Link in bio</div></div>
</div></body></html>
