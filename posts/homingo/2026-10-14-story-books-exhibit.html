<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Homingo story: books exhibit</title>
<link rel="stylesheet" href="../../tools/fonts.css">
<style>
:root{--bg:#F5F6FA;--blue:#2563EB;--ink:#111827;--grey:#6B7280}
html,body{margin:0;background:var(--bg)}
.f{width:1080px;height:1920px;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Sans}
.lab{position:absolute;left:80px;top:270px;font:500 24px Mono;letter-spacing:.18em;color:var(--blue);text-transform:uppercase}
.h{position:absolute;left:80px;right:80px;top:340px;font-family:"Serif";font-size:124px;line-height:.96;letter-spacing:-.025em}
.h em{color:var(--blue);font-style:italic}
.h .s{display:block;font-family:Sans;font-size:38px;line-height:1.35;letter-spacing:0;color:var(--grey);margin-top:30px}
.card{position:absolute;left:150px;top:1010px;width:420px;height:420px;background:#fff;border-radius:36px;box-shadow:0 30px 70px rgba(37,99,235,.16);transform:rotate(-3deg)}
.bk{position:absolute;border-radius:10px 14px 14px 10px}
.bk::after{content:"";position:absolute;left:18px;right:18px;top:50%;height:8px;margin-top:-4px;background:rgba(255,255,255,.7);border-radius:4px}
.plaque{position:absolute;left:560px;top:1080px;width:360px;background:#fff;border:2px solid var(--ink);padding:28px 30px;transform:rotate(2deg);box-shadow:0 18px 40px rgba(17,24,39,.08)}
.plaque .a{font:500 20px Mono;letter-spacing:.16em;color:var(--blue)}
.plaque .b{font:400 46px/1.05 "Serif";margin-top:10px}
.plaque .c{font:400 24px/1.3 Sans;color:var(--grey);margin-top:12px}
.cta{position:absolute;left:80px;right:80px;top:1500px;display:flex;align-items:center;gap:26px}
.cta img{width:104px;height:104px;border-radius:26px;box-shadow:0 12px 30px rgba(37,99,235,.22)}
.cta .t{font:600 38px/1.2 Sans}
.cta .t small{display:block;font:400 26px Sans;color:var(--grey);margin-top:6px}
.cta .l{margin-left:auto;font:italic 400 54px "Serif";color:var(--blue)}
</style></head>
<body><div class="f">
<div class="lab">The Homingo Museum</div>
<div class="h">Semester's done. Last semester's books are <em>still on the shelf.</em><span class="s">Exhibit 02 is on our feed now.</span></div>
<div class="card">
<div class="bk" style="left:50px;top:290px;width:320px;height:60px;background:#2563EB"></div>
<div class="bk" style="left:70px;top:230px;width:290px;height:58px;background:#93B4F8;transform:rotate(-2deg)"></div>
<div class="bk" style="left:44px;top:170px;width:310px;height:58px;background:#1D4ED8;transform:rotate(1.5deg)"></div>
<div class="bk" style="left:66px;top:112px;width:270px;height:56px;background:#3B76F0;transform:rotate(-1deg)"></div>
<div class="bk" style="left:56px;top:56px;width:300px;height:54px;background:#DCE6FD;transform:rotate(2deg)"></div>
</div>
<div class="plaque"><div class="a">EXHIBIT 02</div><div class="b">Last semester's books</div><div class="c">Passed. Still waiting for their result.</div></div>
<div class="cta"><img src="../../brand/homingo-app/app-icon.png" alt=""><div class="t">Tap Sell. List it free.<small>Homingo · Lucknow's local marketplace</small></div><div class="l">Link in bio</div></div>
</div></body></html>
