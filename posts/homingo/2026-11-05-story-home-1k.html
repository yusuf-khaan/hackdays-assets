<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Homingo story: 1K listings</title>
<link rel="stylesheet" href="../../tools/fonts.css">
<style>
:root{--bg:#F5F6FA;--blue:#2563EB;--ink:#111827;--grey:#6B7280}
html,body{margin:0;background:var(--bg)}
.f{width:1080px;height:1920px;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Sans}
.lab{position:absolute;left:80px;top:270px;font:500 24px Mono;letter-spacing:.18em;color:var(--blue);text-transform:uppercase}
.h{position:absolute;left:80px;right:80px;top:330px;font-family:"Serif";font-size:132px;line-height:.97;letter-spacing:-.025em}
.h em{color:var(--blue);font-style:italic}
.h .s{display:block;font-family:Sans;font-size:36px;line-height:1.35;letter-spacing:0;color:var(--grey);margin-top:26px}
.cta{position:absolute;left:80px;top:790px;display:flex;align-items:center;gap:22px}
.cta img{width:76px;height:76px;border-radius:20px;box-shadow:0 10px 26px rgba(37,99,235,.25)}
.cta .p{background:var(--blue);color:#fff;font:600 32px Sans;padding:20px 34px;border-radius:999px;box-shadow:0 14px 30px rgba(37,99,235,.3)}
.cta .r{font:italic 400 52px "Serif";color:var(--blue)}
.phone{position:absolute;left:250px;top:930px;width:580px;height:690px;border-radius:56px 56px 0 0;background:#fff;box-shadow:0 34px 80px rgba(37,99,235,.22);border:10px solid var(--ink);border-bottom:none;overflow:hidden}
.phone img{position:absolute;left:0;top:0;width:560px}
.fade{position:absolute;left:0;right:0;bottom:0;height:90px;background:linear-gradient(rgba(245,246,250,0),var(--bg))}
</style></head>
<body><div class="f">
<div class="lab">Download &middot; Lucknow</div>
<div class="h">1,000+ listings. One <em>search</em> away.<span class="s">Rooms, flats, PGs and second-hand finds. List free.</span></div>
<div class="cta"><img src="../../brand/homingo-app/app-icon.png" alt=""><div class="p">Get Homingo</div><div class="r">Link in bio</div></div>
<div class="phone"><img src="../../brand/homingo-app/home.jpg" alt="Homingo Home screen"></div>
</div></body></html>
