<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Homingo story: cooler asleep</title>
<link rel="stylesheet" href="../../tools/fonts.css">
<style>
:root{--bg:#F5F6FA;--blue:#2563EB;--ink:#111827;--grey:#6B7280}
html,body{margin:0;background:var(--bg)}
.f{width:1080px;height:1920px;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Sans}
.lab{position:absolute;left:80px;top:270px;font:500 24px Mono;letter-spacing:.18em;color:var(--blue);text-transform:uppercase}
.h{position:absolute;left:80px;right:80px;top:330px;font-family:"Serif";font-size:122px;line-height:.97;letter-spacing:-.025em}
.h em{color:var(--blue);font-style:italic}
.h .s{display:block;font-family:Sans;font-size:36px;line-height:1.35;letter-spacing:0;color:var(--grey);margin-top:28px}
.card{position:absolute;left:210px;top:800px;width:660px;height:600px;background:#fff;border-radius:44px;box-shadow:0 34px 80px rgba(37,99,235,.2);transform:rotate(-2deg)}
.card svg{position:absolute;left:80px;top:50px}
.tag{position:absolute;right:-30px;top:60px;background:var(--blue);color:#fff;font:600 28px Sans;padding:14px 28px;border-radius:14px;transform:rotate(6deg);box-shadow:0 14px 30px rgba(37,99,235,.3)}
.cap{position:absolute;left:0;right:0;bottom:30px;text-align:center;font:500 22px Mono;letter-spacing:.16em;color:var(--grey);text-transform:uppercase}
.pk{position:absolute;left:80px;right:80px;top:1430px;display:flex;gap:24px}
.pk div{flex:1;text-align:center;font:600 30px Sans;padding:22px 0;border-radius:999px}
.k{background:#fff;color:var(--grey);border:2px solid #E5E7EB}
.l{background:var(--blue);color:#fff;box-shadow:0 18px 40px rgba(37,99,235,.3)}
.foot{position:absolute;left:80px;right:80px;top:1545px;height:80px}
.foot img{position:absolute;left:0;top:0;width:76px;height:76px;border-radius:20px;box-shadow:0 10px 26px rgba(37,99,235,.25)}
.foot .t{position:absolute;left:100px;top:4px;font:400 24px/1.3 Sans;color:var(--grey)}
.foot .t b{display:block;font:600 30px Sans;color:var(--ink)}
.foot .r{position:absolute;right:0;top:6px;font:italic 400 58px "Serif";color:var(--blue)}
</style></head>
<body><div class="f">
<div class="lab">Let it go &middot; Keep it or list it?</div>
<div class="h">Your cooler is asleep till <em>summer.</em><span class="s">Let someone use it now.</span></div>
<div class="card">
<svg width="500" height="470" viewBox="0 0 500 470" fill="none">
<rect x="70" y="40" width="360" height="360" rx="34" fill="#DCE6FD" stroke="#2563EB" stroke-width="8"/>
<rect x="110" y="86" width="280" height="170" rx="18" fill="#EEF3FE" stroke="#2563EB" stroke-width="6"/>
<g stroke="#93B4F8" stroke-width="10" stroke-linecap="round"><path d="M140 120H360M140 156H360M140 192H360M140 228H360"/></g>
<circle cx="250" cy="320" r="34" fill="#fff" stroke="#2563EB" stroke-width="6"/><path d="M250 296V344M226 320H274" stroke="#3B76F0" stroke-width="6" stroke-linecap="round"/>
<rect x="104" y="400" width="30" height="44" rx="8" fill="#1D4ED8"/><rect x="366" y="400" width="30" height="44" rx="8" fill="#1D4ED8"/>
<path d="M430 120C470 120 470 40 430 40" stroke="#93B4F8" stroke-width="0"/>
</svg>
<div class="tag">Your price</div>
<div class="cap">Sample illustration</div>
</div>
<div class="pk"><div class="k">Keep it</div><div class="l">Tap Sell. List it free.</div></div>
<div class="foot"><img src="../../brand/homingo-app/app-icon.png" alt=""><div class="t"><b>Get Homingo</b>Lucknow's local marketplace</div><div class="r">Link in bio</div></div>
</div></body></html>
